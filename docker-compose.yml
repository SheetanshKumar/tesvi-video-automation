services:
  postgres:
    image: postgres:16
    container_name: tesvi-postgres
    environment:
      POSTGRES_USER: tesvi
      POSTGRES_PASSWORD: tesvi
      POSTGRES_DB: tesvi
    ports:
      - "5432:5432"
    volumes:
      - tesvi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesvi -d tesvi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tesvi-pgdata:
